title: Password Spraying – échecs d'authentification sur de nombreux comptes
id: 3d6a9b2c-4e5f-4a7b-8c9d-0e1f2a3b4c24
status: experimental
description: |
  L'attaquant teste un mot de passe courant (ex. Automne2026!) sur un grand
  nombre de comptes, en restant sous le seuil de verrouillage. Signature :
  une même source génère des échecs sur beaucoup de comptes DIFFÉRENTS en peu
  de temps (contrairement au brute force : beaucoup d'échecs sur UN compte).
  Outils : kerbrute passwordspray, netexec smb -u users.txt -p 'Pass', Spray.
  Couverture des trois protocoles : NTLM réseau (4625), Kerberos (4771 code 0x18),
  validation NTLM sur DC (4776 code 0xC000006A).
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Groupe 3 – 5A 4AS
date: 2026/11/04
modified: 2026/11/04
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection_ntlm:
    EventID: 4625
  selection_kerberos:
    EventID: 4771
    Status: '0x18'
  selection_dc:
    EventID: 4776
    Status: '0xC000006A'
  condition: (selection_ntlm or selection_kerberos or selection_dc) | count(TargetUserName) by IpAddress > 10
falsepositives:
  - Serveur relais (VPN, proxy, bastion) concentrant les échecs de plusieurs utilisateurs
  - Changement de mot de passe d'un compte de service utilisé sur plusieurs machines
level: medium

x_collecte:
  evenements: ["Security 4625 (tous)", "Security 4771 / 4776 (DC)"]
  prerequis: "Audit Logon Failure, Credential Validation, Kerberos Authentication Service (activés)"
  valide_sur_lab: false

x_splunk:
  cron: "*/15 * * * *"
  earliest: "-20m@m"
  latest: "-5m@m"
  trigger: each
  throttle:
    period: 1h
    fields: source
  search: |
    index=main source="WinEventLog:Security"
      (EventCode=4625 OR (EventCode=4771 Failure_Code="0x18") OR (EventCode=4776 Error_Code="0xC000006A"))
    | eval cible=lower(if(EventCode==4625, mvindex(Account_Name, -1), mvindex(Account_Name, 0)))
    | eval source=coalesce(nullif(Source_Network_Address, "-"), replace(Client_Address, "::ffff:", ""), Source_Workstation, Workstation_Name)
    | where isnotnull(source) AND source!="-" AND NOT match(cible, "\$$")
    | stats min(_time) as debut max(_time) as fin count as nb_echecs dc(cible) as nb_comptes values(cible) as comptes_cibles
        values(EventCode) as eventcodes values(ComputerName) as cibles_hotes by source
    | where nb_comptes >= 10
    | convert ctime(debut) ctime(fin)

x_exclusions:
  - "Seuil nb_comptes >= 10 (à ajuster en RUN sur la base du bruit observé)."
  - "Lookup sources_relais.csv (bastion 192.168.10.90 si les utilisateurs s'y authentifient en masse)."

x_triage:
  - "Une authentification RÉUSSIE (4624/4768) a-t-elle suivi depuis la même source pour un des comptes ciblés ? → compte compromis, escalade en HIGH."
  - "Les comptes ciblés existent-ils ? (4625 Sub_Status 0xC0000064 = utilisateur inexistant → liste de l'attaquant)"
  - "Source interne (poste compromis) ou externe (via Tailscale) ?"

x_reponse:
  endiguement:
    - "Bloquer la source sur le pare-feu ; isoler le poste si interne."
    - "Réinitialiser le mot de passe de tout compte ayant réussi à s'authentifier depuis la source."
  remediation:
    - "Politique de mots de passe (longueur, liste noire), MFA sur l'accès distant, verrouillage intelligent."

x_test:
  commande: "netexec smb 192.168.10.100 -u users.txt -p 'Automne2026!' --continue-on-success"
  resultat: "À compléter"
