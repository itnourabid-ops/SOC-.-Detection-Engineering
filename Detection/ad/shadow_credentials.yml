title: Shadow Credentials – écriture de msDS-KeyCredentialLink
id: 7e2f5a8b-1c3d-4e6f-9a0b-c1d2e3f4a523
status: experimental
description: |
  L'attaquant disposant d'un droit d'écriture sur un objet (utilisateur ou
  ordinateur) y ajoute une clé publique dans l'attribut msDS-KeyCredentialLink,
  puis s'authentifie en PKINIT avec la clé privée : il obtient un TGT et le hash
  NT de la cible sans connaître son mot de passe. Outils : pywhisker, Whisker,
  certipy shadow auto.
  Trace : 5136 (modification d'objet AD) sur l'attribut msDS-KeyCredentialLink,
  suivie d'un 4768 avec certificat (Certificate_Issuer_Name renseigné).
references:
  - https://attack.mitre.org/techniques/T1556/
  - https://posts.specterops.io/shadow-credentials-abusing-key-trust-account-mapping-for-takeover-8ee1a53566ab
author: Groupe 3 – 5A 4AS
date: 2026/11/04
modified: 2026/11/04
tags:
  - attack.credential_access
  - attack.persistence
  - attack.t1556
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5136
    AttributeLDAPDisplayName: 'msDS-KeyCredentialLink'
  filter_whfb:
    SubjectUserName|endswith: '$'          # un ordinateur qui enregistre sa propre clé (WHfB / Azure AD Join)
  condition: selection and not filter_whfb
falsepositives:
  - Windows Hello for Business, Azure AD Connect (MSOL_*) – absents du périmètre Dunder Mifflin
level: high

x_collecte:
  evenements: ["Security 5136 (DC)", "Security 4768 avec certificat (PKINIT)"]
  prerequis: |
    Audit Directory Service Changes : Success (activé sur DC – annexe p.15) MAIS il faut
    aussi une SACL (Audit "Write property" / Everyone) sur la racine du domaine pour que
    l'attribut soit journalisé. À VÉRIFIER sur le lab, sinon pivot de secours : 4768 PKINIT.
  valide_sur_lab: false

x_splunk:
  cron: "*/15 * * * *"
  earliest: "-20m@m"
  latest: "-5m@m"
  trigger: each
  search: |
    index=main source="WinEventLog:Security" EventCode=5136 LDAP_Display_Name="msDS-KeyCredentialLink"
      NOT Account_Name="*$" NOT Account_Name="MSOL_*"
    | eval operation=case(Operation_Type=="%%14674" OR Type=="Value Added", "ajout", Operation_Type=="%%14675" OR Type=="Value Deleted", "suppression", true(), Type)
    | table _time ComputerName Account_Name Logon_ID DN operation Class

x_exclusions:
  - "Exclusion des comptes machines (WHfB) et MSOL_* (Azure AD Connect)."

x_triage:
  - "Qui a modifié (Account_Name) ? Ce compte a-t-il un rôle d'admin AD ?"
  - "Objet ciblé (DN) : compte à privilèges ? contrôleur de domaine ?"
  - "Un 4768 avec certificat pour l'objet ciblé a-t-il suivi ? (pivot 'PKINIT')"

x_reponse:
  endiguement:
    - "Supprimer la valeur ajoutée dans msDS-KeyCredentialLink (Get-ADUser -Properties msDS-KeyCredentialLink)."
    - "Désactiver le compte auteur de la modification ; réinitialiser le mot de passe du compte ciblé."
  remediation:
    - "Auditer les ACL (BloodHound) : qui a GenericWrite / WriteProperty sur les comptes sensibles ?"

x_test:
  commande: "pywhisker -d test.local -u <user> -p <mdp> --target <victime> --action add --dc-ip 192.168.10.100"
  resultat: "À compléter – vérifier d'abord la présence de 5136"
