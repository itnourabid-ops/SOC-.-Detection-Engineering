title: Linux – recherche et collecte de secrets (password looting)
id: b2c3d4e5-6f7a-4b8c-9d0e-1f2a3b4c5d31
status: experimental
description: |
  L'attaquant cherche des identifiants stockés sur le serveur : /etc/shadow,
  clés SSH, historiques shell, fichiers de config (.env, wp-config.php,
  .git-credentials, .aws/credentials), coffres KeePass, ou grep récursif sur
  "password". Particulièrement pertinent pour LINSERV-DEV (dépôt de code,
  secrets applicatifs) et LINSERV-BAST (clés SSH vers tout le LAN).
references:
  - https://attack.mitre.org/techniques/T1552/001/
  - https://attack.mitre.org/techniques/T1552/004/
  - https://attack.mitre.org/techniques/T1003/008/
author: Groupe 3 – 5A 4AS
date: 2026/11/04
modified: 2026/11/04
tags:
  - attack.credential_access
  - attack.t1552.001
  - attack.t1552.004
  - attack.t1003.008
logsource:
  product: linux
  service: kunai
detection:
  selection:
    info.event.name: execve
    data.command_line|contains:
      - /etc/shadow
      - id_rsa
      - id_ed25519
      - .ssh/
      - _history
      - .git-credentials
      - .aws/credentials
      - wp-config.php
      - .kdbx
      - unshadow
      - mimipenguin
      - lazagne
  selection_grep:
    info.event.name: execve
    data.command_line|re: '(grep|rg|find).*(-i|-r).*(passw|secret|token|api_key|credential)'
  condition: selection or selection_grep
falsepositives:
  - Administrateur qui gère des clés SSH (ssh-keygen, ssh-copy-id), outils de sauvegarde
level: high

x_collecte:
  evenements: ["Kunai execve"]
  prerequis: "Kunai + UF. Champs JSON à confirmer sur le lab."
  valide_sur_lab: false

x_splunk:
  cron: "*/10 * * * *"
  earliest: "-15m@m"
  latest: "-5m@m"
  trigger: each
  throttle:
    period: 1h
    fields: hote,uid
  search: |
    index=main sourcetype=kunai "info.event.name"=execve
    | rename "info.host.name" as hote, "info.task.uid" as uid, "data.exe.path" as exe, "data.command_line" as cmd, "data.ancestors" as ancetres
    | eval motif=case(
        match(cmd, "/etc/shadow|unshadow|mimipenguin|(?i)lazagne"), "hash système",
        match(cmd, "id_rsa|id_ed25519|id_ecdsa|authorized_keys|\.ssh/"), "clés SSH",
        match(cmd, "_history"), "historique shell",
        match(cmd, "\.git-credentials|\.aws/credentials|wp-config\.php|\.env\b|\.kdbx|\.pgpass|\.my\.cnf"), "fichier de secrets",
        match(cmd, "(?i)(grep|rg|find)\s.*(passw|secret|token|api_?key|credential)"), "recherche de mots-clés",
        true(), null())
    | where isnotnull(motif) AND NOT match(exe, "/(ssh-keygen|ssh-copy-id|ssh-agent|sshd)$")
    | stats min(_time) as debut dc(motif) as nb_motifs values(motif) as motifs values(cmd) as commandes values(ancetres) as ancetres by hote uid
    | convert ctime(debut)

x_exclusions:
  - "Binaires de gestion SSH légitimes (ssh-keygen, ssh-copy-id, sshd)."
  - "En RUN : exclure les scripts de sauvegarde par ancêtre précis."

x_triage:
  - "Un uid non-root lit /etc/shadow → tentative (échec attendu) ou élévation de privilège déjà réussie ?"
  - "Les fichiers lus contiennent-ils des secrets valides ? Lesquels ? (liste des comptes à réinitialiser)"
  - "Sur le bastion : les clés SSH trouvées donnent accès à quels serveurs ?"

x_reponse:
  endiguement:
    - "Couper la session et bloquer la source ; considérer les secrets lus comme compromis."
  remediation:
    - "Rotation des secrets exposés (clés SSH, tokens, mots de passe applicatifs) ; coffre de secrets."

x_test:
  commande: "cat /etc/shadow; cat ~/.bash_history; find / -name id_rsa 2>/dev/null; grep -ri password /etc /var/www 2>/dev/null"
  resultat: "À compléter"
