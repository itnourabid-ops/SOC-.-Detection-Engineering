[[BUILD] [CRITICAL] Dump de la mémoire LSASS]
description = Extraction des secrets en mémoire (hash NT, tickets Kerberos, mots de passe en clair WDigest) par lecture de la mémoire du processus lsass.exe. Trois angles : 1. Sysmon 10 : ouverture de lsass avec des droits de lecture mémoire (mimikatz, nanodump, procdump, Task Manager) ; 2. Sysmon 1 : ligne de commande connue (comsvcs.dll MiniDump, procdump -ma lsass, rundll32 ... MiniDump) ; 3. Sysmon 11 : création d'un fichier *lsass*.dmp. À distance : impacket-secretsdump (registre SAM/LSA – autre technique), lsassy, netexec --lsa / -M lsassy (utilise comsvcs MiniDump → angle 2). | Règle: Detection/windows/dump_lsass.yml (id 6d9a2c5f-8b1e-4f3a-c4d6-e7f8a9b0c129)
search = index=main source="WinEventLog:Microsoft-Windows-Sysmon/Operational" ( \
    (EventCode=10 TargetImage="*\\lsass.exe" GrantedAccess IN ("0x1010","0x1410","0x1438","0x143a","0x1fffff","0x1FFFFF","0x40") \
      NOT SourceImage IN ("*\\MsMpEng.exe","*\\wininit.exe","*\\csrss.exe","*\\Sysmon64.exe","*\\Sysmon.exe","*\\svchost.exe","*\\lsm.exe")) \
 OR (EventCode=1 (CommandLine="*comsvcs*MiniDump*" OR CommandLine="*procdump*lsass*" OR CommandLine="*procdump*-ma*" OR CommandLine="*sekurlsa*" OR CommandLine="*nanodump*")) \
 OR (EventCode=11 TargetFilename="*lsass*.dmp") ) \
| eval outil=coalesce(SourceImage, Image), detail=coalesce(CommandLine, TargetFilename, "GrantedAccess=".GrantedAccess) \
| eval angle=case(EventCode==10, "accès mémoire lsass", EventCode==1, "ligne de commande de dump", EventCode==11, "fichier .dmp créé") \
| stats min(_time) as debut values(angle) as angles values(detail) as details values(User) as User by ComputerName outil \
| convert ctime(debut)
