[[BUILD] [MEDIUM] Exécution distante via WMI sans redirection (wmiexec -silentcommand)]
description = Complément de la règle Impacket WMIExec. Avec -silentcommand, wmiexec lance directement le binaire (ex. calc.exe) comme enfant de WmiPrvSE.exe, sans cmd.exe et sans redirection vers \\127.0.0.1 (Guide BUILD p.11-12). La seule trace est "un processus inhabituel enfant de WmiPrvSE, dans une session réseau". Règle séparée car plus bruyante : WmiPrvSE lance légitimement des processus (SCCM, inventaires, scripts d'admin). Sévérité plus basse, exclusions par lookup. | Règle: Detection/windows/wmi_execution_distante.yml (id 2a7d9c41-55e0-4d83-b1f6-7c3e8a0d9b12)
search = index=main source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 ParentImage="*\\wmiprvse.exe" \
  NOT CommandLine="*127.0.0.1*" \
  NOT Image IN ("*\\WmiPrvSE.exe", "*\\WerFault.exe", "*\\msiexec.exe") \
| join type=left max=1 ComputerName LogonId \
    [ search index=main source="WinEventLog:Security" EventCode=4624 Logon_Type=3 earliest=-24h \
      | eval LogonId=mvindex(Logon_ID, -1) \
      | rename Source_Network_Address as src_ip, Workstation_Name as poste_attaquant \
      | fields ComputerName LogonId src_ip poste_attaquant ] \
| where isnotnull(src_ip) AND src_ip!="-" AND src_ip!="::1" AND src_ip!="127.0.0.1" \
| table _time ComputerName User LogonId src_ip poste_attaquant Image CommandLine ParentCommandLine
