[[BUILD] [HIGH] AS-REPRoasting – TGT délivré sans pré-authentification]
description = Pour les comptes ayant l'option "Do not require Kerberos preauthentication", n'importe qui peut demander un TGT (AS-REP) dont une partie est chiffrée avec le hash du mot de passe, puis le casser hors ligne. Outils : impacket-GetNPUsers, Rubeus asreproast. Trace : 4768 avec Pre_Authentication_Type = 0 (pas de pré-auth), souvent en RC4. | Règle: Detection/ad/asreproasting.yml (id 4c8d2e1f-6a7b-4c9d-a0e1-f2a3b4c5d622)
search = index=main source="WinEventLog:Security" EventCode=4768 Pre_Authentication_Type=0 (Result_Code="0x0" OR Status="0x0") \
| eval src_ip=replace(Client_Address, "::ffff:", "") \
| stats min(_time) as debut max(_time) as fin count dc(Account_Name) as nb_comptes values(Account_Name) as comptes_vises \
    values(Ticket_Encryption_Type) as chiffrement by src_ip ComputerName \
| convert ctime(debut) ctime(fin)
enableSched = 1
disabled = 0
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.severity = 4
alert.track = 1
alert.expires = 24h
action.webhook = 1
action.webhook.param.url = http://soc_n8n:5678/webhook/alert
request.ui_dispatch_app = SA_BUILD
request.ui_dispatch_view = search
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = src_ip

[[BUILD] [CRITICAL] DCSync – réplication AD demandée par un compte non-DC]
description = L'attaquant possédant les droits de réplication (Domain Admins, ou ACL DS-Replication-Get-Changes-All abusive) se fait passer pour un contrôleur de domaine et demande via DRSUAPI les secrets (hash NT, dont krbtgt) de tout ou partie des comptes. Outils : impacket-secretsdump -just-dc, mimikatz lsadump::dcsync. Trace : 4662 sur l'objet domaine avec les GUID des droits de réplication, émis par un compte qui n'est PAS un compte machine de DC. | Règle: Detection/ad/dcsync.yml (id 8f3b6c9d-2e4a-4b5c-9d0e-1f2a3b4c5d25)
search = index=main source="WinEventLog:Security" EventCode=4662 \
  (Properties="*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*" OR Properties="*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*" OR Properties="*89e95b76-444d-4c62-991a-0facbeda640c*") \
| eval compte=mvindex(Account_Name, 0), LogonId=mvindex(Logon_ID, 0) \
| where NOT match(compte, "\$$") AND NOT like(compte, "MSOL_%") \
| join type=left max=1 ComputerName LogonId \
    [ search index=main source="WinEventLog:Security" EventCode=4624 earliest=-24h \
      | eval LogonId=mvindex(Logon_ID, -1) \
      | rename Source_Network_Address as src_ip, Workstation_Name as poste_source \
      | fields ComputerName LogonId src_ip poste_source ] \
| stats min(_time) as debut count values(src_ip) as src_ip values(poste_source) as poste_source by ComputerName compte LogonId \
| convert ctime(debut)
enableSched = 1
disabled = 0
cron_schedule = */5 * * * *
