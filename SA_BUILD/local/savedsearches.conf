[[BUILD] [LOW] Linux – multiples commandes d'énumération en rafale]
description = Après un accès initial, l'attaquant reconnaît le système : identité, réseau, processus, privilèges sudo, binaires SUID, crons. Individuellement banales, ces commandes deviennent suspectes quand beaucoup de commandes DIFFÉRENTES sont lancées par le même utilisateur en quelques minutes (ou par un script : linpeas, LinEnum). Source : Kunai (événement execve), déployé sur tous les serveurs Linux. | Règle: Detection/linux/enumeration.yml (id a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c30)
search = index=main sourcetype=kunai "info.event.name"=execve \
| rename "info.host.name" as hote, "info.task.uid" as uid, "data.exe.path" as exe, "data.command_line" as cmd, "data.ancestors" as ancetres \
| eval binaire=mvindex(split(exe, "/"), -1) \
| where match(binaire, "^(whoami|id|uname|hostname|ifconfig|ip|netstat|ss|ps|w|last|lsb_release|crontab|sudo|find|getent|arp|route)$") \
| eval marqueur=case(match(cmd, "-perm\s+-?[u4]"), "recherche SUID", match(cmd, "sudo\s+-l"), "sudo -l", true(), null()) \
| stats min(_time) as debut max(_time) as fin dc(binaire) as nb_binaires values(cmd) as commandes values(marqueur) as marqueurs values(ancetres) as ancetres \
    by hote uid \
| where nb_binaires >= 5 OR isnotnull(marqueurs) \
| convert ctime(debut) ctime(fin)
