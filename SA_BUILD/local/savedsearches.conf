[[BUILD] [HIGH] Kerberoasting – demande de tickets de service en RC4]
description = L'attaquant (simple compte du domaine) demande des tickets de service (TGS) pour des comptes utilisateurs portant un SPN, en forçant le chiffrement RC4 (0x17), puis casse le ticket hors ligne pour retrouver le mot de passe du compte de service. Outils : impacket-GetUserSPNs -request, Rubeus kerberoast. Dans un domaine moderne (AES par défaut), un TGS RC4 vers un compte de service utilisateur est anormal ; plusieurs SPN demandés d'affilée est caractéristique. | Règle: Detection/ad/kerberoasting.yml (id 9b1e4c7a-2d3f-4a5b-8c6d-7e8f9a0b1c21)
search = index=main source="WinEventLog:Security" EventCode=4769 Ticket_Encryption_Type="0x17" (Failure_Code="0x0" OR Status="0x0") \
  NOT Service_Name="*$" NOT Service_Name="krbtgt" \
| eval compte=mvindex(split(Account_Name, "@"), 0), src_ip=replace(Client_Address, "::ffff:", "") \
| stats min(_time) as debut max(_time) as fin count dc(Service_Name) as nb_spn values(Service_Name) as spn_demandes \
    by compte src_ip ComputerName \
| convert ctime(debut) ctime(fin)
