[[BUILD] [MEDIUM] Création d'un service suspect]
description = Installation d'un service pour exécution en SYSTEM ou persistance. Très utilisé pour le mouvement latéral : impacket-psexec (service au nom aléatoire, binaire aléatoire dans ADMIN$), impacket-smbexec (binpath = %COMSPEC% /Q /c echo ...), Cobalt Strike, ou un driver malveillant. Trace : System 7045 (toujours journalisé) et Security 4697 (Audit Security System Extension activé partout). | Règle: Detection/windows/service_suspect.yml (id 5b8e1a4c-7d9f-4c2b-a3e5-6f7a8b9c0d27)
search = index=main ((source="WinEventLog:System" EventCode=7045) OR (source="WinEventLog:Security" EventCode=4697)) \
| eval binaire=coalesce(Service_File_Name, Image_Path, ImagePath) \
| eval motif=case( \
    match(binaire, "(?i)%COMSPEC%|cmd(\.exe)?\s+/[qc]"), "interpréteur cmd (smbexec ?)", \
    match(binaire, "(?i)powershell|-enc|mshta|rundll32|regsvr32"), "LOLBIN / powershell", \
    match(binaire, "(?i)\\\\(AppData|Temp|Users\\\\Public)\\\\|\\\\ADMIN\$|127\.0\.0\.1"), "chemin inscriptible / partage admin", \
    match(Service_Name, "^[A-Za-z]{4}$|^[A-Za-z0-9]{8}$") AND NOT match(binaire, "(?i)Program Files"), "nom aléatoire (psexec ?)", \
    true(), null()) \
| where isnotnull(motif) \
| eval niveau=if(match(motif, "smbexec|psexec|powershell"), "HIGH", "MEDIUM") \
| table _time ComputerName EventCode Service_Name binaire Service_Account Service_Start_Type motif niveau
enableSched = 1
disabled = 0
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.severity = 3
alert.track = 1
alert.expires = 24h
action.webhook = 1
action.webhook.param.url = http://soc_n8n:5678/webhook/alert
request.ui_dispatch_app = SA_BUILD
request.ui_dispatch_view = search
alert.suppress = 1
alert.suppress.period = 4h
alert.suppress.fields = ComputerName,Service_Name

[[BUILD] [MEDIUM] Création d'une tâche planifiée suspecte]
description = Persistance ou exécution différée via le planificateur de tâches (schtasks, Register-ScheduledTask, impacket-atexec). "Suspecte" = la tâche lance un interpréteur ou un LOLBIN, depuis un répertoire inscriptible par l'utilisateur, avec du contenu encodé ou téléchargé, ou s'exécute en SYSTEM. ATTENTION collecte : sur les DC, "Audit Other Object Access Events" = No Auditing (annexe p.16) → l'événement 4698 n'existe PAS sur WINSERV-DC. La règle combine donc Sysmon 1 (schtasks.exe /create) et Sysmon 11 (fichier créé dans C:\Windows\System32\Tasks\, couvre aussi l'API / atexec) – présents partout – et 4698 là où il existe (serveurs). | Règle: Detection/windows/tache_planifiee_suspecte.yml (id 1a4c7e0b-3d5f-4b8a-9c1e-2f3a4b5c6d26)
search = index=main ( \
    (source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\schtasks.exe" CommandLine="*/create*") \
 OR (source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=11 TargetFilename="C:\\Windows\\System32\\Tasks\\*") \
 OR (source="WinEventLog:Security" EventCode=4698) ) \
| eval detail=coalesce(CommandLine, Task_Content, Message) \
| rex field=detail "(?i)/tn\s+\"?(?<tache_cli>[^\"/]+)" \
| eval tache=coalesce(Task_Name, tache_cli, replace(TargetFilename, "(?i)^C:\\\\Windows\\\\System32\\\\Tasks", "")) \
| eval suspect=if(match(detail, "(?i)(\\\\AppData\\\\|\\\\Temp\\\\|\\\\Users\\\\Public|powershell|cmd(\.exe)? /c|-enc|https?://|mshta|rundll32|regsvr32|certutil|bitsadmin|/ru\s+\"?system)") OR EventCode==11, 1, 0) \
| where suspect=1 AND NOT match(tache, "(?i)(GoogleUpdate|MicrosoftEdgeUpdate|OneDrive|Adobe)") \
| eval auteur=coalesce(User, mvindex(Account_Name, 0)) \
| stats min(_time) as debut values(EventCode) as sources values(detail) as detail values(auteur) as auteur values(Image) as processus by ComputerName tache \
| convert ctime(debut)
enableSched = 1
disabled = 0
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
