[[BUILD] [MEDIUM] Scan de ports interne (horizontal / vertical)]
description = Reconnaissance réseau depuis un hôte interne (ou via le VPN Tailscale) : - vertical : une source teste de nombreux PORTS sur peu d'hôtes (nmap -p-) ; - horizontal : une source teste un même port sur de nombreux HÔTES (balayage SMB/RDP/SSH du /24). Source : flux Suricata (eve.json, event_type=flow), complétés par les alertes ET SCAN de Suricata. Limite : la sonde ne voit que le trafic qui passe par elle (FW en prod ; sur le lab, seulement le trafic du serveur Linux, sauf port miroir). | Règle: Detection/reseau/scan_ports.yml (id c3d4e5f6-7a8b-4c9d-0e1f-2a3b4c5d6e32)
search = index=main sourcetype=suricata ((event_type=flow proto=TCP) OR (event_type=alert "alert.signature"="ET SCAN*")) \
| eval sig='alert.signature' \
| stats dc(dest_port) as nb_ports dc(dest_ip) as nb_hotes values(sig) as signatures \
    min(_time) as debut max(_time) as fin by src_ip \
| eval type=case(nb_ports>=50 AND nb_hotes<=5, "vertical", nb_hotes>=20, "horizontal", nb_ports>=50, "mixte", isnotnull(signatures), "signature Suricata", true(), null()) \
| where isnotnull(type) \
| convert ctime(debut) ctime(fin)
