[[BUILD] [HIGH] Linux – recherche et collecte de secrets (password looting)]
description = L'attaquant cherche des identifiants stockés sur le serveur : /etc/shadow, clés SSH, historiques shell, fichiers de config (.env, wp-config.php, .git-credentials, .aws/credentials), coffres KeePass, ou grep récursif sur "password". Particulièrement pertinent pour LINSERV-DEV (dépôt de code, secrets applicatifs) et LINSERV-BAST (clés SSH vers tout le LAN). | Règle: Detection/linux/password_looting.yml (id b2c3d4e5-6f7a-4b8c-9d0e-1f2a3b4c5d31)
search = index=main sourcetype=kunai "info.event.name"=execve \
| rename "info.host.name" as hote, "info.task.uid" as uid, "data.exe.path" as exe, "data.command_line" as cmd, "data.ancestors" as ancetres \
| eval motif=case( \
    match(cmd, "/etc/shadow|unshadow|mimipenguin|(?i)lazagne"), "hash système", \
    match(cmd, "id_rsa|id_ed25519|id_ecdsa|authorized_keys|\.ssh/"), "clés SSH", \
    match(cmd, "_history"), "historique shell", \
    match(cmd, "\.git-credentials|\.aws/credentials|wp-config\.php|\.env\b|\.kdbx|\.pgpass|\.my\.cnf"), "fichier de secrets", \
    match(cmd, "(?i)(grep|rg|find)\s.*(passw|secret|token|api_?key|credential)"), "recherche de mots-clés", \
    true(), null()) \
| where isnotnull(motif) AND NOT match(exe, "/(ssh-keygen|ssh-copy-id|ssh-agent|sshd)$") \
| stats min(_time) as debut dc(motif) as nb_motifs values(motif) as motifs values(cmd) as commandes values(ancetres) as ancetres by hote uid \
| convert ctime(debut)
