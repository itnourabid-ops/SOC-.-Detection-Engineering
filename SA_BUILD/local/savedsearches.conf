[[BUILD] [MEDIUM] Password Spraying – échecs d'authentification sur de nombreux comptes]
description = L'attaquant teste un mot de passe courant (ex. Automne2026!) sur un grand nombre de comptes, en restant sous le seuil de verrouillage. Signature : une même source génère des échecs sur beaucoup de comptes DIFFÉRENTS en peu de temps (contrairement au brute force : beaucoup d'échecs sur UN compte). Outils : kerbrute passwordspray, netexec smb -u users.txt -p 'Pass', Spray. Couverture des trois protocoles : NTLM réseau (4625), Kerberos (4771 code 0x18), validation NTLM sur DC (4776 code 0xC000006A). | Règle: Detection/ad/password_spraying.yml (id 3d6a9b2c-4e5f-4a7b-8c9d-0e1f2a3b4c24)
search = index=main source="WinEventLog:Security" \
  (EventCode=4625 OR (EventCode=4771 Failure_Code="0x18") OR (EventCode=4776 Error_Code="0xC000006A")) \
| eval cible=lower(if(EventCode==4625, mvindex(Account_Name, -1), mvindex(Account_Name, 0))) \
| eval source=coalesce(nullif(Source_Network_Address, "-"), replace(Client_Address, "::ffff:", ""), Source_Workstation, Workstation_Name) \
| where isnotnull(source) AND source!="-" AND NOT match(cible, "\$$") \
| stats min(_time) as debut max(_time) as fin count as nb_echecs dc(cible) as nb_comptes values(cible) as comptes_cibles \
    values(EventCode) as eventcodes values(ComputerName) as cibles_hotes by source \
| where nb_comptes >= 10 \
| convert ctime(debut) ctime(fin)
