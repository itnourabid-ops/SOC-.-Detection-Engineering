[[BUILD] [HIGH] Beaconing C2 – connexions sortantes à intervalle régulier]
description = Un implant (Cobalt Strike, Sliver, Mythic…) contacte son serveur C2 à intervalle quasi constant (sleep + faible jitter). On mesure, pour chaque couple source → destination externe, la régularité des connexions : coefficient de variation (écart-type / moyenne de l'intervalle) faible et nombre de connexions élevé. Source : flux Suricata (event_type=flow). | Règle: Detection/reseau/beaconing.yml (id d4e5f6a7-8b9c-4d0e-1f2a-3b4c5d6e7f33)
search = index=main sourcetype=suricata event_type=flow \
| where NOT cidrmatch("10.0.0.0/8", dest_ip) AND NOT cidrmatch("172.16.0.0/12", dest_ip) AND NOT cidrmatch("192.168.0.0/16", dest_ip) AND NOT cidrmatch("100.64.0.0/10", dest_ip) \
| eval dns_name=coalesce('tls.sni', 'http.hostname') \
| sort 0 src_ip dest_ip dest_port _time \
| streamstats current=f last(_time) as precedent by src_ip dest_ip dest_port \
| eval delta=_time-precedent \
| stats count as nb_connexions avg(delta) as intervalle_moyen stdev(delta) as ecart_type sum(bytes_toserver) as octets_envoyes \
    values(dns_name) as domaine by src_ip dest_ip dest_port \
| eval cv=round(ecart_type/intervalle_moyen, 3), intervalle_moyen=round(intervalle_moyen, 1) \
| where nb_connexions >= 20 AND intervalle_moyen >= 10 AND cv < 0.2 \
| sort cv
