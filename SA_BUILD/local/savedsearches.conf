[[BUILD] [HIGH] Shadow Credentials – écriture de msDS-KeyCredentialLink]
description = L'attaquant disposant d'un droit d'écriture sur un objet (utilisateur ou ordinateur) y ajoute une clé publique dans l'attribut msDS-KeyCredentialLink, puis s'authentifie en PKINIT avec la clé privée : il obtient un TGT et le hash NT de la cible sans connaître son mot de passe. Outils : pywhisker, Whisker, certipy shadow auto. Trace : 5136 (modification d'objet AD) sur l'attribut msDS-KeyCredentialLink, suivie d'un 4768 avec certificat (Certificate_Issuer_Name renseigné). | Règle: Detection/ad/shadow_credentials.yml (id 7e2f5a8b-1c3d-4e6f-9a0b-c1d2e3f4a523)
search = index=main source="WinEventLog:Security" EventCode=5136 LDAP_Display_Name="msDS-KeyCredentialLink" \
  NOT Account_Name="*$" NOT Account_Name="MSOL_*" \
| eval operation=case(Operation_Type=="%%14674" OR Type=="Value Added", "ajout", Operation_Type=="%%14675" OR Type=="Value Deleted", "suppression", true(), Type) \
| table _time ComputerName Account_Name Logon_ID DN operation Class
enableSched = 1
disabled = 0
